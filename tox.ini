[tox]
# Define the matrix: Python versions cross-multiplied by framework families
envlist = py{39,310,311,312}-{base,torch,tf,jax,mlx,pax}
isolated_build = True

[testenv]
runner = uv-venv-lock-runner

deps =
    pytest
    pytest-cov
    mypy
    ruff
    interrogate
    -rrequirements.txt
    torch: -rrequirements-pytorch.txt
    tf: -rrequirements-keras.txt
    tf: -rrequirements-tensorflow.txt
    jax: -rrequirements-jax.txt
    jax: -rrequirements-flax.txt
    mlx: -rrequirements-mlx.txt

commands =
    base: pytest {posargs:tests}
    torch: pytest {posargs:tests} -m torch --no-cov
    tf: pytest {posargs:tests} -m tf --no-cov
    jax: pytest {posargs:tests} -m jax --no-cov
    mlx: pytest {posargs:tests} -m mlx --no-cov
    pax: pytest {posargs:tests} -m pax --no-cov
