[tox]
# Define the matrix: Python 3.12 cross-multiplied by framework families
envlist = py312-{base,torch,tf,jax,mlx,pax}
skipsdist = True

[testenv]
deps =
    -rrequirements-test.txt

commands_pre =
    python -m pip install "pydantic>=2.0.0" "cdd @ git+https://github.com/offscale/cdd-python.git@master"
    python -m pip install "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl" "ml-switcheroo-compiler @ https://github.com/SamuelMarks/ml-switcheroo-compiler/releases/download/v0.0.1/ml_switcheroo_compiler-0.0.1-py3-none-any.whl"
    python -m pip install --no-deps "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
    python -m pip install --no-deps -r requirements.txt
    python -m pip install --no-deps -e .

commands =
    base: pytest {posargs:tests}
    torch: pytest {posargs:tests} -m torch --no-cov
    tf: pytest {posargs:tests} -m tf --no-cov
    jax: pytest {posargs:tests} -m jax --no-cov
    mlx: pytest {posargs:tests} -m mlx --no-cov
    pax: pytest {posargs:tests} -m pax --no-cov

