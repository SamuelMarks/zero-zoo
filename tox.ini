[tox]
# Define the matrix: Python versions cross-multiplied by framework families
envlist = py{39,310,311,312}-{base,torch,tf,jax,mlx}, py{39,310}-pax
isolated_build = True

[testenv]
# tox-uv natively uses global wheel caching and filesystem hardlinks/reflinks.
# This means having 20 different virtual environments containing `numpy` or `pytest` 
# consumes almost zero extra disk space, making granular environments incredibly efficient.
deps =
    -rrequirements-dev.txt
    -e ../ml-switcheroo-compiler
    
    # Framework-specific factors load only what they need:
    torch: torch
    torch: -e ../zero-pytorch
    
    tf: tensorflow
    tf: keras
    tf: -e ../zero-tensorflow
    tf: -e ../zero-keras
    
    jax: jax
    jax: flax
    jax: -e ../zero-jax
    jax: -e ../zero-flax
    
    mlx: mlx
    mlx: -e ../zero-mlx
    
    pax: pax-framework
    pax: -e ../zero-pax

commands =
    # Map execution to specific pytest markers to avoid running tests where deps aren't installed
    base: pytest {posargs:tests} -m "not (torch or tf or jax or mlx or pax)"
    torch: pytest {posargs:tests} -m torch
    tf: pytest {posargs:tests} -m tf
    jax: pytest {posargs:tests} -m jax
    mlx: pytest {posargs:tests} -m mlx
    pax: pytest {posargs:tests} -m pax
