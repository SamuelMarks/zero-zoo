[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "zero-zoo"
version = "0.1.0"
description = "Standardized Model Zoo for cross-framework equivalence."
authors = [{ name = "Samuel Marks" }]
requires-python = ">=3.9"
dynamic = ["dependencies"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "playwright", "tox", "tox-uv", "mypy"]

# Zero Zoo Specific Frameworks
jax = ["zero-jax @ git+https://github.com/SamuelMarks/zero-jax.git@master", "ml-switcheroo-compiler[jax]"]
flax = ["zero-flax @ git+https://github.com/SamuelMarks/zero-flax.git@master", "ml-switcheroo-compiler[jax]"] # Flax uses JAX backend
keras = ["zero-keras @ git+https://github.com/SamuelMarks/zero-keras.git@master", "ml-switcheroo-compiler[keras]"]
pytorch = ["zero-pytorch @ git+https://github.com/SamuelMarks/zero-pytorch.git@master", "ml-switcheroo-compiler[torch]"]
mlx = ["zero-mlx @ git+https://github.com/SamuelMarks/zero-mlx.git@master", "ml-switcheroo-compiler[mlx]"]
tensorflow = ["zero-tensorflow @ git+https://github.com/SamuelMarks/zero-tensorflow.git@master", "ml-switcheroo-compiler[tensorflow]"]

# General Switcheroo Backend support
numpy = ["ml-switcheroo-compiler[numpy]"]
cupy = ["ml-switcheroo-compiler[cupy]"]

[tool.ruff]
line-length = 88
target-version = 'py39'

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I', 'D', 'UP', 'ANN']

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.pytest.ini_options]
addopts = '--cov=src --cov=tests --cov-report=term-missing --cov-fail-under=100'
testpaths = ['tests']
markers = [
    "torch: PyTorch tests",
    "tf: TensorFlow tests",
    "jax: JAX tests",
    "mlx: MLX tests",
    "pax: Pax tests",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
