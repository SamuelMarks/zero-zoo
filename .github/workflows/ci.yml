name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  test_matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        framework: ['base', 'torch', 'tf', 'jax', 'mlx']
        include:
          - python-version: '3.9'
            framework: 'pax'
          - python-version: '3.10'
            framework: 'pax'
        exclude:
          - python-version: '3.11'
            framework: 'mlx' # Usually we just run MLX locally on macOS, but let's allow it if there's a linux stub, otherwise we might exclude
            # For this CI, we'll run what's available
    
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies & tox-uv
      run: |
        python3 -m pip install --upgrade pip
        pip install tox tox-uv ruff mypy pytest pytest-cov build
        
    - name: Check Code Formatting & Docs/Types linting (Ruff)
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: |
        ruff format --check .
        ruff check .
        
    - name: Strict Type Checking (Mypy)
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: mypy .

    - name: Run Test Matrix (Tox)
      run: |
        # Strip the period for tox format e.g., py310-torch
        PY_VER=$(echo "${{ matrix.python-version }}" | tr -d '.')
        tox -e py${PY_VER}-${{ matrix.framework }}

    - name: Verify 100% Coverage & Update Badges
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: |
        # In a real setup, we'd combine coverage across matrix, but here's the check
        python3 scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: python3 -m build
