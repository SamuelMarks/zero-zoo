name: CI Matrix & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        framework: ['base', 'torch', 'tf', 'jax', 'mlx', 'pax']

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        uv venv --python ${{ matrix.python-version }}
        source .venv/bin/activate
        uv pip install --system -e ".[test]"

    - name: Code Formatting & Linting (Ruff)
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: |
        ruff format --check .
        ruff check .

    - name: Static AST Typing, Docs, Dependencies & Compliance
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: |
        python3 scripts/lint_typing.py
        python3 scripts/check_docs.py
        python3 scripts/check_deps.py
        python3 scripts/check_compliance.py

    - name: Strict Type Checking (Mypy)
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: mypy --strict src/zero_zoo scripts tests

    - name: Docstring Coverage (100% Gate)
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: interrogate -vv -f 100 -M -i src/zero_zoo scripts tests

    - name: Run Matrix Tests via Tox
      run: |
        PY_VER=$(echo ${{ matrix.python-version }} | tr -d '.')
        tox -e py${PY_VER}-${{ matrix.framework }}

    - name: Verify Coverage & Badges
      if: matrix.python-version == '3.12' && matrix.framework == 'base' && matrix.os == 'ubuntu-latest'
      run: |
        python3 scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      if: matrix.python-version == '3.12' && matrix.framework == 'base'
      run: python3 -m build
